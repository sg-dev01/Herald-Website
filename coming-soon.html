<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Herald — Every Player Deserves an Entrance</title>
  <meta name="description" content="Walkout music and AI player announcements for youth sports. Coming soon to the App Store." />
  <meta name="theme-color" content="#FFFFFF" />
  <!-- The light icon by default (and on dark tab bars); light tab bars get
       the dark icon. -->
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon-light.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon-dark.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon-light.svg" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon-dark.svg" media="(prefers-color-scheme: light)" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <style>
    /* Shown at gameherald.app until the full site launches: _redirects
       serves this page for "/". Remove that line to put index.html live.
       Figma: Website page, frame "coming-soon". */
    :root {
      --ink: #000000;
      --white: #FFFFFF;
      --blue: #0031E5;            /* Figma: newblue */
      --field-border: #BFCCF9;
      --caption: rgba(21, 20, 57, 0.4);
      /* SF Compact / SF Pro where the visitor has them (Apple devices),
         else the self-hosted Inter. */
      --font-display: "SF Compact Display", "SF Compact", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--white);
      color: var(--ink);
      font: 400 20px/1.4 var(--font-text);
      text-align: center;
      padding: max(30px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
      overflow-x: hidden;
    }
    .logo { display: block; width: clamp(130px, 22vw, 202px); height: auto; }

    .copy { margin-top: clamp(48px, 7vw, 100px); display: flex; flex-direction: column; align-items: center; gap: 10px; }
    h1 {
      margin: 0;
      max-width: 931px;
      font: 900 clamp(44px, 8.5vw, 96px)/0.885 var(--font-display);
      letter-spacing: -0.052em;
      text-wrap: balance;
    }
    .tagline, .soon { margin: 0; font-weight: 600; font-size: clamp(18px, 2.4vw, 24px); }
    .tagline { margin-top: clamp(14px, 2.5vw, 30px); text-wrap: balance; }
    .soon { margin-top: clamp(40px, 7vw, 90px); }

    .signup { margin-top: clamp(40px, 8.5vw, 131px); width: 100%; max-width: 1060px; }
    .signup form { display: flex; gap: clamp(12px, 2.5vw, 30px); max-width: 582px; margin: 0 auto; }
    .signup input[type="email"] {
      flex: 1 1 auto;
      min-width: 0;
      height: clamp(54px, 6vw, 70px);
      padding: 0 28px;
      border: 2px solid var(--field-border);
      border-radius: 9999px;
      background: var(--white);
      color: var(--ink);
      font: 400 18px var(--font-text);
    }
    .signup input[type="email"]::placeholder { color: var(--caption); }
    .signup button {
      flex: 0 0 auto;
      height: clamp(54px, 6vw, 70px);
      padding: 0 30px;
      border: 0;
      border-radius: 9999px;
      background: var(--blue);
      color: var(--white);
      font: 500 20px "Inter", var(--font-text);
      cursor: pointer;
    }
    .signup button:disabled { opacity: 0.6; }
    .signup input[type="email"]:focus-visible, .signup button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
    /* Bots fill this in; people never see it. */
    .signup .website { position: absolute; left: -9999px; }
    .caption { margin: clamp(14px, 2.4vw, 30px) auto 0; color: var(--caption); text-wrap: balance; }

    /* The phones sit on the bottom edge, cropped like the Figma frame. */
    .phones { margin-top: auto; padding-top: clamp(48px, 7vw, 100px); width: 100%; display: flex; justify-content: center; }
    .phones img { display: block; width: min(928px, 100%); height: auto; }

    @media (max-width: 480px) {
      .signup form { flex-direction: column; }
      .signup button { width: 100%; }
    }
  </style>
</head>
<body>
  <img class="logo" src="/images/coming-soon/herald-logo.svg" width="202" height="216" alt="Herald" />

  <main class="copy">
    <h1>Every player deserves an entrance</h1>
    <p class="tagline">Professional stadium sound for every field, every team, every kid.</p>
    <p class="soon">Coming Soon to the App Store</p>
  </main>

  <!-- Posts to /subscribe in worker.js, which forwards it to Kit from the
       server, so a visitor's browser never contacts Kit. -->
  <section class="signup" aria-label="Email sign-up">
    <form id="signup-form" method="post" action="/subscribe">
      <input type="email" name="email_address" placeholder="Email address" aria-label="Email address" autocomplete="email" required />
      <input class="website" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
      <button type="submit">subscribe</button>
    </form>
    <p class="caption" id="signup-status" role="status">Be the first to know! Get an email when Herald lands on the App Store</p>
    <script>
      document.getElementById('signup-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.target;
        const status = document.getElementById('signup-status');
        const button = form.querySelector('button');
        button.disabled = true;
        try {
          const response = await fetch(form.action, { method: 'POST', body: new FormData(form), headers: { accept: 'application/json' } });
          status.textContent = (await response.json()).message;
          if (response.ok) form.hidden = true;
        } catch {
          status.textContent = "That didn't go through. Please try again in a moment.";
        }
        button.disabled = false;
      });
    </script>
  </section>

  <div class="phones">
    <img src="/images/coming-soon/phones.webp" width="928" height="302" alt="Herald on three iPhones in red, blue, and green" />
  </div>
</body>
</html>
