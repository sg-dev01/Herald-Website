<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gameday — Every Player Deserves an Entrance</title>
  <meta name="description" content="Walkout music and AI player announcements for youth sports. Coming soon to the App Store." />
  <meta name="theme-color" content="#0064FF" />
  <!-- The light icon by default (and on dark tab bars); light tab bars get
       the dark icon. -->
  <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-light.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-dark.png" media="(prefers-color-scheme: light)" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <style>
    /* Shown at getgameday.app until the full site launches: _redirects
       serves this page for "/". Remove that line to put index.html live. */
    :root {
      --hero-blue: #0064FF;
      --white: #FFFFFF;
      --field-border: #D6E4FF;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      --font-logo: "Syne", "Arial Black", sans-serif;
      --font-accent: "Yellowtail", "Brush Script MT", cursive;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    /* Two tones: the blue hero ends in a hard cut just below "Coming soon",
       and the sign-up sits on white beneath it. */
    body {
      background: var(--white);
      font: 18px/1.5 var(--font-body);
      display: flex;
      flex-direction: column;
      text-align: center;
    }
    .hero, .signup-band {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-left: max(24px, env(safe-area-inset-left));
      padding-right: max(24px, env(safe-area-inset-right));
    }
    .hero {
      background: var(--hero-blue);
      color: var(--white);
      padding-top: max(56px, env(safe-area-inset-top));
      padding-bottom: 56px;
    }
    .signup-band {
      flex: 1;
      color: var(--hero-blue);
      padding-top: 48px;
      padding-bottom: max(48px, env(safe-area-inset-bottom));
    }
    .hero { gap: 22px; }
    .hero > * { max-width: 820px; }
    /* Inline, so it shows however the page is opened. */
    .badge { width: 88px; height: 106px; color: var(--white); }
    /* Pure white: the paragraph dimming below doesn't apply to it. */
    .wordmark { margin: 0; font: 800 clamp(17px, 4.5vw, 26px)/1 var(--font-logo); letter-spacing: 0.04em; text-transform: uppercase; opacity: 1; }
    h1 { margin: 8px 0 0; font: 800 clamp(28px, 9vw, 76px)/1.05 var(--font-body); letter-spacing: -0.035em; }
    /* Exactly two lines: each stays whole. */
    h1 .line { display: block; white-space: nowrap; }
    .accent-word { font-family: var(--font-accent); font-weight: 400; font-size: 1.1em; letter-spacing: 0; }
    p { margin: 0; opacity: 0.86; text-wrap: balance; max-width: 560px; }
    .signup { width: 100%; max-width: 440px; }
    .signup h2 { margin: 0 0 4px; font: 600 22px/1.25 var(--font-body); color: var(--hero-blue); }
    .signup > p { margin: 0 auto 20px; color: var(--hero-blue); opacity: 1; }
    .signup form { display: flex; flex-wrap: wrap; gap: 10px; }
    .signup input[type="email"] { flex: 1 1 220px; min-width: 0; border: 0; border-radius: 999px; padding: 14px 20px; font: 400 16px var(--font-body); color: #0A0A0B; background: var(--white); box-shadow: inset 0 0 0 1.5px var(--field-border); }
    .signup button { flex: 0 0 auto; border: 0; border-radius: 999px; padding: 14px 24px; cursor: pointer; background: var(--hero-blue); color: var(--white); font: 600 16px var(--font-body); }
    .signup button:disabled { opacity: 0.6; }
    .signup input[type="email"]:focus-visible, .signup button:focus-visible { outline: 3px solid var(--hero-blue); outline-offset: 2px; }
    /* Bots fill this in; people never see it. */
    .signup .website { position: absolute; left: -9999px; }
    .signup .signup-status { margin: 12px auto 0; color: var(--hero-blue); opacity: 1; }
    .signup .signup-status:empty { display: none; }
    .soon { margin-top: 10px; padding: 10px 20px; border-radius: 999px; background: rgba(255, 255, 255, 0.16); font-weight: 600; font-size: 16px; opacity: 1; }
  </style>
</head>
<body>
  <main class="hero">

    </svg>
    <p class="wordmark">Gameday</p>
    <h1><span class="line">Every player</span><span class="line">deserves an <span class="accent-word">entrance</span></span></h1>
    <p>Professional stadium sound for every field, every team, every kid.</p>
    <p class="soon">Coming soon to the App Store</p>
  </main>

  <section class="signup-band" aria-label="Email sign-up">
    <!-- Posts to /subscribe in worker.js, which forwards it to Kit from the
         server, so a visitor's browser never contacts Kit. -->
    <div class="signup">
      <h2>Be the first to know</h2>
      <p>Get an email when Gameday lands on the App Store.</p>
      <form id="signup-form" method="post" action="/subscribe">
        <input type="email" name="email_address" placeholder="Email address" aria-label="Email address" autocomplete="email" required />
        <input class="website" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <button type="submit">Subscribe</button>
      </form>
      <p class="signup-status" id="signup-status" role="status"></p>
      <script>
        document.getElementById('signup-form').addEventListener('submit', async (event) => {
          event.preventDefault();
          const form = event.target;
          const status = document.getElementById('signup-status');
          const button = form.querySelector('button');
          button.disabled = true;
          status.textContent = '';
          try {
            const response = await fetch(form.action, { method: 'POST', body: new FormData(form), headers: { accept: 'application/json' } });
            status.textContent = (await response.json()).message;
            if (response.ok) form.hidden = true;
          } catch {
            status.textContent = "That didn't go through. Please try again in a moment.";
          }
          button.disabled = false;
        });
      </script>
    </div>
  </section>
</body>
</html>
